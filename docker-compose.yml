x-app-env: &app-env
  DATABASE_URL: postgresql://perps:${POSTGRES_PASSWORD:-perps}@postgres:5432/perps
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  S3_ENDPOINT: http://localstack:4566
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
  INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?set INTERNAL_SERVICE_KEY in .env}
  MARKET_ID: ${MARKET_ID:?set MARKET_ID in .env}

x-app: &app
  build:
    context: .
    target: backend
  image: perps-backend:latest
  restart: unless-stopped
  init: true
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    localstack:
      condition: service_healthy
    init:
      condition: service_completed_successfully

x-worker-healthcheck: &worker-healthcheck
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 30s

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: perps
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-perps}
      POSTGRES_DB: perps
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perps"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3
    restart: unless-stopped
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  init:
    build:
      context: .
      target: migrate
    image: perps-migrate:latest
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://perps:${POSTGRES_PASSWORD:-perps}@postgres:5432/perps
      MARKET_ID: ${MARKET_ID:?set MARKET_ID in .env}
    command: ["sh", "scripts/init.sh"]

  server:
    <<: *app
    environment:
      <<: *app-env
      PORT: "3000"
    command: ["bun", "apps/server/src/index.ts"]
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  engine:
    <<: *app
    environment:
      <<: *app-env
      S3_BUCKET: perps-engine
      ENGINE_KEY: engine-snapshot.json
      HEALTH_PORT: "3010"
    command: ["bun", "services/engine/src/index.ts"]
    healthcheck:
      <<: *worker-healthcheck
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3010/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]

  persistence:
    <<: *app
    environment:
      <<: *app-env
      S3_BUCKET: perps-events
      HEALTH_PORT: "3011"
    command: ["bun", "services/persistence/src/index.ts"]
    healthcheck:
      <<: *worker-healthcheck
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3011/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]

  websocket:
    <<: *app
    environment:
      <<: *app-env
      PORT: "8080"
      HEALTH_PORT: "3012"
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-http://localhost:3001}
    command: ["bun", "services/websocket/src/index.ts"]
    ports:
      - "8080:8080"
    healthcheck:
      <<: *worker-healthcheck
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3012/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]

  mark-price-engine:
    <<: *app
    environment:
      <<: *app-env
      HEALTH_PORT: "3013"
    command: ["bun", "services/mark-price-engine/src/index.ts"]
    healthcheck:
      <<: *worker-healthcheck
      start_period: 60s
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3013/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]

  liquidation-engine:
    <<: *app
    environment:
      <<: *app-env
      API_URL: http://server:3000
      HEALTH_PORT: "3014"
    command: ["bun", "services/liquidation-engine/src/index.ts"]
    healthcheck:
      <<: *worker-healthcheck
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3014/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]

  funding-rate-scheduler:
    <<: *app
    environment:
      <<: *app-env
      HEALTH_PORT: "3015"
    command: ["bun", "services/funding-rate-scheduler/src/index.ts"]
    healthcheck:
      <<: *worker-healthcheck
      start_period: 90s
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3015/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080}
    image: perps-web:latest
    restart: unless-stopped
    init: true
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "3001:3001"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  localstack_data:
